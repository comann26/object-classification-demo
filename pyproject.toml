[project]
name = "object-classification-demo"
version = "0.1.0"
description = "Webcam object detection and threat-scoring demo"
requires-python = "==3.12.*"
dependencies = [
    "ultralytics==8.4.163",  # exact: detector.py relies on WorldModel.clip_model / text_model.CLIP
    # CLIP text encoder for YOLO-World, pinned by hashed archive URL (not git) so
    # Ultralytics never pip-installs it at runtime (docs/design.md §4).
    "clip @ https://github.com/ultralytics/CLIP/archive/a13192f8cb767260d7dfd98c843b0716593169e7.zip",
    "supervision>=0.26,<0.31",  # sv.ByteTrack is removed in 0.31
    "opencv-python",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "numpy",
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
    "pygrabber; sys_platform == 'win32'",
    # Intel Mac (docs/design.md §4): torch has no macOS x86_64 wheels after 2.2, and
    # torch 2.2 is built against numpy 1.x; opencv-python 4.12+ needs numpy>=2 and
    # 4.11 needs macOS 13, so 4.10.0.84 (macOS 12 wheel). ultralytics/supervision
    # stay on the global pins: 8.4.163 and 0.30.5 resolve with these.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-python==4.10.0.84; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# Windows torch variant, picked by the launcher: `--extra cu12x` if nvidia-smi is
# present, else `--extra cpu`. macOS runs with no extra: torch comes from PyPI
# (MPS on Apple Silicon; the Intel pins above on x86_64). The extras only change
# where torch comes from, and only on win32 (see [tool.uv.sources]).
[project.optional-dependencies]
cpu = ["torch", "torchvision"]
cu12x = ["torch", "torchvision"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-socket",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu12x" }]]
environments = ["sys_platform == 'win32'", "sys_platform == 'darwin'"]  # the only platforms

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu12x", extra = "cu12x", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu12x", extra = "cu12x", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu12x"
url = "https://download.pytorch.org/whl/cu126"  # CUDA 12.6: the 12.x build serving torch 2.14 win cp312
explicit = true

[tool.hatch.metadata]
allow-direct-references = true  # the hashed CLIP archive URL above

[tool.hatch.build.targets.wheel]
packages = ["demo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# OpenCV raises and handles first-chance SEH access violations internally on Windows
# (goodFeaturesToTrack / calcOpticalFlowPyrLK); pytest's faulthandler prints them as
# noise. They are not crashes.
addopts = "-p no:faulthandler"
markers = [
    "offline: real YOLO-World detector under blocked network (skipped if models/ absent)",
]
# FastAPI's TestClient still wraps httpx; Starlette now nags to swap in `httpx2`.
# Silence only that notice rather than add a dependency for tests.
filterwarnings = [
    # clip.load() of the openai ViT-B-32.pt (a TorchScript archive) goes through
    # torch.jit.load, which torch 2.14 marks deprecated. Not ours to fix.
    "ignore:`torch.jit.load` is deprecated:FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
