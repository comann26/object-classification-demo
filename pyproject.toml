[project]
name = "object-classification-demo"
version = "0.1.0"
description = "Webcam object detection and threat-scoring demo"
requires-python = "==3.12.*"
dependencies = [
    "ultralytics",
    "supervision",
    "opencv-python",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-socket",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
